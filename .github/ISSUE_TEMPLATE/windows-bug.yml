name: Windows 版问题反馈 / Windows Bug Report
description: 报告 Windows 客户端或随包浏览器扩展的问题
labels: ["bug", "windows"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 问题分类 / Affected Area
      options:
        - 下载、续传或任务记录
        - 网盘、分享或批量下载
        - 视频、音频或字幕
        - 浏览器扩展或网页识别
        - 安装、更新或启动
        - 窗口、界面或闪退
        - 其他或不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本 / App Version
      placeholder: 例如 0.2.20
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 使用环境 / Environment
      description: 可补充诊断信息里没有的环境。界面显示异常时，也可以写显示缩放和显示器数量。
      placeholder: 例如 Windows 11 x64、安装版、Edge、125% 缩放
  - type: textarea
    id: description
    attributes:
      label: 问题描述与复现步骤 / Description & Steps
      description: 请写出触发问题的操作、看到的结果和期望的结果。偶发问题可补充出现时间和频率。
      placeholder: |
        1. 从哪个页面或操作开始？
        2. 做了什么后出现问题？
        3. 实际发生了什么？期望发生什么？
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息（可选） / Diagnostics
      description: 从 App 打开反馈页时会自动填入。手动打开时，可在「设置 → 关于 → 复制诊断信息」后粘贴到这里。
  - type: upload
    id: attachments
    attributes:
      label: 上传截图、录屏或日志（可选） / Attachments
      description: |
        复现后，在「设置 → 关于 → 打开日志目录」找到 `app.log`。如果 App 打不开，可在资源管理器地址栏打开 `%LOCALAPPDATA%\com.shandian.windows\logs`。
        复制问题发生前后几分钟的日志到 `.txt` 后上传。刚轮换的日志可能在 `app.1.log`。也可以把日志片段直接粘贴到上面的诊断信息框。
        窗口显示异常可附包含通知卡片和主窗口的截图或短录屏。提交前请遮掉私有链接、提取码、账号、Token 和个人路径。
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.txt,.log"
